name: SonarQube CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo, pdo_mysql

      - name: Install Composer dependencies
        run: |
          php -v
          if (Test-Path 'composer.json') {
            composer install --no-interaction --prefer-dist
          }
        working-directory: backend
        shell: pwsh

      - name: Download SonarScanner CLI
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'sonar-scanner'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $url = 'https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.9.0.37505-linux.zip'
          $zip = Join-Path $root 'sonar-scanner.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root

      - name: Run SonarScanner
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'sonar-scanner'
          $scanner = Join-Path $root 'sonar-scanner-4.9.0.37505-linux/bin/sonar-scanner'
          & $scanner `
            -Dsonar.projectKey=KCPM `
            -Dsonar.sources=backend,frontend `
            -Dsonar.host.url='${{ secrets.SONAR_HOST_URL }}' `
            -Dsonar.login='${{ secrets.SONAR_TOKEN }}' `
            -Dsonar.sourceEncoding=UTF-8

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
